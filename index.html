    <script>
      (function() {
        try {
          let desc = Object.getOwnPropertyDescriptor(window, 'fetch');
          if (!desc && Object.getPrototypeOf(window)) {
            desc = Object.getOwnPropertyDescriptor(Object.getPrototypeOf(window), 'fetch');
          }
          if (desc && desc.get && !desc.set) {
            let currentFetch = window.fetch;
            Object.defineProperty(window, 'fetch', {
              get() { return currentFetch; },
              set(v) { currentFetch = v; },
              configurable: true,
              enumerable: true
            });
          }
        } catch (e) {
          // fallback ignore
        }
      })();
    </script>
    <title>محاسبه‌گر هزینه اسناد و سهم‌الارث | دفتر اسناد رسمی ۶۶۲ تهران</title>

    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js').then(function(registration) {
            console.log('Notary 662 PWA ServiceWorker registration successful with scope: ', registration.scope);
          }, function(err) {
            console.log('ServiceWorker registration failed: ', err);
          });
        });
      }
    </script>
